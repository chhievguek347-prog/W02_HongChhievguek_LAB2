<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card Exercise</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>
    <div class="profile-card">
        <div class="banner"></div>
        <div class="profile-container">
            <div class="image-container">
                <img src="cat.jpg" alt="profile picture" width="100px" height="100px">
            </div>

            <h1>Coca Cola</h1>
            <p class="title">UX/UI Mobile Designer</p>
            <p class="bio">Passionate about creating intuitive and engaging user experiences for mobile applications.
            </p>

            <div class="stats">
                <div>
                    <h2>100</h2>
                    <p>Projects</p>
                </div>

                <div>
                    <h2>67</h2>
                    <p>Following</p>
                </div>

                <div>
                    <h2>1M</h2>
                    <p>Followers</p>
                </div>
            </div>

            <div class="social-icons">
                <a href="https://www.facebook.com" target="_blank" aria-label="Facebook">
                    <i class="fa-brands fa-facebook-f"></i>
                </a>

                <a href="https://www.linkedin.com" target="_blank" aria-label="LinkedIn">
                    <i class="fa-brands fa-linkedin-in"></i>
                </a>

                <a href="https://www.github.com" target="_blank" aria-label="GitHub">
                    <i class="fa-brands fa-github"></i>
                </a>
            </div>

            <div class="profile-button">
               <a href="profile.html">View Profile</a>
            </div>
        </div>
    </div>


</body>

</html>
